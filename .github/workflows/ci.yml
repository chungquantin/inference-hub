name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: inference_hub
          POSTGRES_PASSWORD: inference_hub
          POSTGRES_DB: inference_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inference_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inference_hub:inference_hub@localhost:5432/inference_hub
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Seed data imports cleanly
        run: cargo run -q -p seed
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p api --bin openapi > /tmp/openapi.json
          diff -u packages/api-client/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm --filter @inference-hub/api-client generate
          git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm -r typecheck
      - run: pnpm --filter web lint
