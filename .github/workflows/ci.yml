name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p api --bin openapi > /tmp/openapi.json
          diff -u packages/api-client/openapi.json /tmp/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm --filter @inference-hub/api-client generate
          git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm -r typecheck
      - run: pnpm --filter web lint
