services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: inference-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inference_hub
      POSTGRES_PASSWORD: inference_hub
      POSTGRES_DB: inference_hub
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inference_hub -d inference_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
